services:
  core_api:
    build:
      # Contexte élargi à la racine du repo pour pouvoir copier packages/
      # (dépendance partagée mockapi-client) dans l'image.
      context: .
      dockerfile: apps/core_api/Dockerfile
    # Même fichier que en local (voir apps/core_api/.env.example).
    # Ne pas redéfinir ENERVISION_API_* dans environment : cela écraserait
    # les valeurs du fichier et empêcherait d'atteindre l'API mock du formateur.
    env_file:
      - apps/core_api/.env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - enervision-net

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        # URL vue par le navigateur (build-time Next.js).
        NEXT_PUBLIC_API_BFF_URL: ${NEXT_PUBLIC_API_BFF_URL:-http://localhost:8000}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - core_api
    networks:
      - enervision-net

networks:
  enervision-net:
    driver: bridge
