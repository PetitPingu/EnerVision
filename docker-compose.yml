services:
  core_api:
    build:
      # Contexte élargi à la racine du repo pour pouvoir copier packages/
      # (dépendance partagée mockapi-client) dans l'image.
      context: .
      dockerfile: apps/core_api/Dockerfile
    environment:
      ENERVISION_API_HOST: ${ENERVISION_API_HOST:-host.docker.internal}
      ENERVISION_API_PORT: ${ENERVISION_API_PORT:-1234}
      ENERVISION_REQUEST_TIMEOUT: ${ENERVISION_REQUEST_TIMEOUT:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - enervision-net

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        # URL vue par le navigateur (build-time Next.js).
        NEXT_PUBLIC_API_BFF_URL: ${NEXT_PUBLIC_API_BFF_URL:-http://localhost:8000}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - core_api
    networks:
      - enervision-net

networks:
  enervision-net:
    driver: bridge
