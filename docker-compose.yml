services:
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - enervision-net

  # Image TimescaleDB (surcouche Postgres) au lieu de postgres:16-alpine, pour
  # disposer de l'extension timescaledb sur les séries temporelles — le
  # service reste nommé "postgres" pour ne pas casser les autres services.
  postgres:
    image: timescale/timescaledb:2.15.3-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - enervision-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - enervision-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - enervision-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKETS: ${MINIO_BUCKETS}
    entrypoint: /bin/sh
    command: /init/create-buckets.sh
    volumes:
      - ./minio/init:/init:ro
    networks:
      - enervision-net

  core_api:
    build:
      # Contexte élargi à la racine du repo pour pouvoir copier packages/
      # (dépendance partagée mockapi-client) dans l'image.
      context: .
      dockerfile: apps/core_api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PREDICTION_URL: http://prediction:8000
      RECOMMENDATION_URL: http://recommendation:8000
    depends_on:
      postgres:
        condition: service_healthy
      prediction:
        condition: service_started
      recommendation:
        condition: service_started
    networks:
      - enervision-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.core_api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.core_api.entrypoints=web"
      - "traefik.http.services.core_api.loadbalancer.server.port=8000"

  prediction:
    build:
      context: ./apps/prediction
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - enervision-net

  recommendation:
    build:
      context: ./apps/recommendation
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PREDICTION_URL: http://prediction:8000
    depends_on:
      postgres:
        condition: service_healthy
      prediction:
        condition: service_started
    networks:
      - enervision-net

  etl_worker:
    build:
      # Contexte élargi à la racine du repo pour pouvoir copier packages/
      # (dépendance partagée mockapi-client) dans l'image.
      context: .
      dockerfile: apps/etl_worker/Dockerfile
    environment:
      # TransformJob (readings_curated) : +psycopg, même driver que db_schema.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENERVISION_API_SCHEME: ${ENERVISION_API_SCHEME:-http}
      ENERVISION_API_HOST: ${ENERVISION_API_HOST}
      ENERVISION_API_PORT: ${ENERVISION_API_PORT}
      ENERVISION_API_USERNAME: ${ENERVISION_API_USERNAME}
      ENERVISION_API_PASSWORD: ${ENERVISION_API_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-raw}
      ETL_POLL_INTERVAL_SECONDS: ${ETL_POLL_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - enervision-net

networks:
  enervision-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  redis-data:
