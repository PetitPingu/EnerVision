name: Build and push images (GHCR)

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/**"
      - "mlflow/**"
      - "packages/**"
      - ".github/workflows/images-build-push.yml"
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "apps/**"
      - "mlflow/**"
      - "packages/**"
      - ".github/workflows/images-build-push.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/petitpingu/enervision

jobs:
  build-push:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: core_api
            dockerfile: apps/core_api/Dockerfile
          - app: prediction
            dockerfile: apps/prediction/Dockerfile
          - app: recommendation
            dockerfile: apps/recommendation/Dockerfile
          - app: etl_worker
            dockerfile: apps/etl_worker/Dockerfile
          - app: dashboard
            dockerfile: apps/dashboard/Dockerfile
            dashboard_build: true
          - app: mlflow
            dockerfile: mlflow/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.dashboard_build == true && format('NEXT_PUBLIC_API_BFF_URL={0}', vars.DASHBOARD_API_BFF_URL != '' && vars.DASHBOARD_API_BFF_URL || 'http://localhost:8000') || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
