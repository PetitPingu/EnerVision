name: Dashboard Lint

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard-lint.yml"
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened

defaults:
  run:
    working-directory: apps/dashboard

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
