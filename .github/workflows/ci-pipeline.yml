name: CI Pipeline

# Pipeline unique et séquentiel : build → test → scan.
# Chaque étape attend la réussite de la précédente (needs:) pour éviter de
# consommer des minutes CI sur des tests ou un scan alors que le build a
# échoué. À l'intérieur d'une même étape, les jobs (et les apps en matrix)
# tournent en parallèle.
#
# Remplace les anciens workflows indépendants : dashboard-build.yml,
# dashboard-lint.yml, dashboard-e2e.yml, integration-tests.yml,
# prediction-tests.yml, trivy.yml.

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read
  # Nécessaire pour publier les résultats Trivy (SARIF) sur l'onglet
  # Security et faire apparaître les vulnérabilités en annotations sur la
  # page du run / les fichiers changés d'une PR.
  security-events: write

env:
  # Valeur factice pour la compilation CI (cf. apps/dashboard/.env.example)
  NEXT_PUBLIC_API_BFF_URL: http://localhost:8001
  # Identifiants locaux, valables uniquement pour la durée du run CI (mêmes
  # valeurs que les anciens workflows integration-tests.yml / dashboard-e2e.yml).
  POSTGRES_USER: enervision_ci
  POSTGRES_PASSWORD: enervision_ci
  POSTGRES_DB: enervision
  MINIO_ROOT_USER: enervision_ci
  MINIO_ROOT_PASSWORD: enervision_ci
  MINIO_BUCKETS: raw,processed,models,backups
  DATABASE_URL: postgresql+psycopg://enervision_ci:enervision_ci@localhost:5432/enervision
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: localhost:9000

jobs:
  # ---------------------------------------------------------------------
  # Étape 1 : build
  # ---------------------------------------------------------------------
  build:
    name: "Build: Next.js production build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------
  # Étape 2 : test (parallèle entre jobs, exécutée uniquement si build a réussi)
  # ---------------------------------------------------------------------
  lint:
    name: "Test: ESLint"
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit-prediction:
    name: "Test: pytest (prediction)"
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/prediction

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/prediction/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  integration:
    name: "Test: pytest -m integration - ${{ matrix.app }}"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - core_api
          - etl_worker
          - prediction
          - recommendation

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start infra (Postgres, Redis, MinIO)
        run: docker compose up -d --wait postgres redis minio

      - name: Create MinIO buckets
        run: docker compose run --rm minio-init

      - name: Run database migrations
        run: docker compose run --rm migrate

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        working-directory: apps/${{ matrix.app }}
        run: python -m pytest -m integration -v

      - name: Dump infra logs on failure
        if: failure()
        run: docker compose logs postgres redis minio migrate minio-init

      - name: Stop infra
        if: always()
        run: docker compose down -v

  e2e:
    name: "Test: Playwright"
    needs: build
    runs-on: ubuntu-latest
    env:
      # CORS_ORIGINS a une valeur par défaut côté core_api compatible avec ce
      # run (cf. apps/core_api/presentation/api.py, port 3000).
      # ENERVISION_API_HOST/PORT doivent en revanche être fournis explicitement :
      # docker-compose.yml les injecte tels quels (`${ENERVISION_API_HOST}`)
      # dans le conteneur, donc sans .env local ni override ici la clé existe
      # mais vide, ce qui empêche le fallback "localhost" de infrastructure/config.py
      # de s'appliquer (os.environ.get ne retombe sur le défaut que si la clé
      # est absente, pas si elle est vide).
      ENERVISION_API_SCHEME: https
      ENERVISION_API_HOST: api-mock.charlieandre.fr
      ENERVISION_API_PORT: ""
      ENERVISION_API_USERNAME: ${{ secrets.ENERVISION_API_USERNAME }}
      ENERVISION_API_PASSWORD: ${{ secrets.ENERVISION_API_PASSWORD }}
      NEXT_PUBLIC_API_BFF_URL: http://localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start backend stack (docker compose)
        run: docker compose up -d --build core_api traefik

      - name: Wait for core_api to be reachable through Traefik
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost/health -o /dev/null; then
              echo "core_api is up"
              exit 0
            fi
            sleep 3
          done
          echo "core_api did not become ready in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Seed sites and default admin (packages/db-schema/alembic/seeds)
        run: |
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" < packages/db-schema/alembic/seeds/seed_sites.sql
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" < packages/db-schema/alembic/seeds/seed_admin_user.sql

      - name: Seed extra test users for e2e (apps/dashboard/e2e/*.spec.ts)
        # /auth/login (voir apps/core_api/presentation/api.py) n'a pas
        # d'endpoint d'inscription public : ces comptes n'existent que dans
        # cette base jetable, recréée à chaque run. Identifiants fixes en
        # dur ici (pas des secrets réels) car les specs les référencent
        # tels quels. Hash bcrypt de "testpass123" et "bobpass456".
        run: |
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
            "INSERT INTO enervision.users (id, email, password_hash, role) VALUES (gen_random_uuid(), 'alice@example.com', '\$2b\$12\$5cz3fy9ebsUuCvt5gBja.OLPDWGqSjjlDPlE46BrL2aNWvmR8WHc2', 'admin');"
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
            "INSERT INTO enervision.users (id, email, password_hash, role) VALUES (gen_random_uuid(), 'bob@example.com', '\$2b\$12\$r/FMLj3ByQQMc2LqiqMavuB1zw9AB5wkpnvJAJu5A9xP7ObjY7UKC', 'viewer');"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/dashboard
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: apps/dashboard
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 7

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop backend stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------
  # Étape 3 : scan (uniquement si toute l'étape test a réussi).
  # scan-image est enchaîné après scan-fs (pas de parallélisation entre les
  # deux) : leurs conditions de branche (dev / main) sont mutuellement
  # exclusives, donc scan-fs est "skipped" sur main — mais ce skip est
  # indiscernable (needs.scan-fs.result == 'skipped') d'un skip causé par un
  # échec des jobs de test en amont (scan-fs serait alors aussi "skipped").
  # scan-image reprend donc explicitement les 4 jobs de test dans `needs` et
  # vérifie leur success() un par un, en plus de scan-fs (success OU
  # skipped) — sinon un échec de test n'empêcherait pas le build d'image.
  # ---------------------------------------------------------------------
  scan-fs:
    name: "Scan: deps (fs) - ${{ matrix.app }}"
    needs:
      - lint
      - unit-prediction
      - integration
      - e2e
    if: |
      (github.event_name == 'push' && github.ref_name == 'dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - core_api
          - dashboard
          - etl_worker
          - prediction
          - recommendation

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/${{ matrix.app }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: "trivy-fs-${{ matrix.app }}"

      - name: Run Trivy vulnerability scanner (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/${{ matrix.app }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  scan-image:
    name: "Scan: image - ${{ matrix.app }}"
    needs:
      - lint
      - unit-prediction
      - integration
      - e2e
      - scan-fs
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.unit-prediction.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.e2e.result == 'success' &&
      (needs.scan-fs.result == 'success' || needs.scan-fs.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref_name == 'main') ||
       (github.event_name == 'pull_request' && github.base_ref == 'main'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - core_api
          - dashboard
          - etl_worker
          - prediction
          - recommendation

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: enervision/${{ matrix.app }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: enervision/${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: "trivy-image-${{ matrix.app }}"

      - name: Run Trivy vulnerability scanner (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: enervision/${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  scan-quality:
    name: "Scan: quality (SonarCloud)"
    needs:
      - lint
      - unit-prediction
      - integration
      - e2e
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.unit-prediction.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historique complet requis pour la pertinence de l'analyse (blame, nouveau code)

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
