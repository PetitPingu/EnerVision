name: Dashboard Build

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard-build.yml"
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened

defaults:
  run:
    working-directory: apps/dashboard

env:
  # Valeur factice pour la compilation CI (cf. apps/dashboard/.env.example)
  NEXT_PUBLIC_API_BFF_URL: http://localhost:8001

jobs:
  build:
    name: Next.js production build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
