name: Dashboard E2E

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/dashboard/**"
      - "apps/core_api/**"
      - "apps/prediction/**"
      - "apps/recommendation/**"
      - "packages/**"
      - "docker-compose.yml"
      - ".github/workflows/dashboard-e2e.yml"
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "apps/dashboard/**"
      - "apps/core_api/**"
      - "apps/prediction/**"
      - "apps/recommendation/**"
      - "packages/**"
      - "docker-compose.yml"
      - ".github/workflows/dashboard-e2e.yml"

env:
  # Identifiants locaux, valables uniquement pour la durée du run CI.
  POSTGRES_USER: enervision_ci
  POSTGRES_PASSWORD: enervision_ci
  POSTGRES_DB: enervision
  MINIO_ROOT_USER: enervision_ci
  MINIO_ROOT_PASSWORD: enervision_ci
  MINIO_BUCKETS: raw,processed,models,backups
  # CORS_ORIGINS et ENERVISION_API_* ont des valeurs par défaut côté
  # core_api (cf. apps/core_api/presentation/api.py et infrastructure/config.py)
  # compatibles avec ce run (port 3000, mock non appelé ici).
  NEXT_PUBLIC_API_BFF_URL: http://localhost

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start backend stack (docker compose)
        run: docker compose up -d --build core_api traefik

      - name: Wait for core_api to be reachable through Traefik
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost/api/v1/sites -o /dev/null; then
              echo "core_api is up"
              exit 0
            fi
            sleep 3
          done
          echo "core_api did not become ready in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/dashboard
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: apps/dashboard
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 7

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop backend stack
        if: always()
        run: docker compose down -v
