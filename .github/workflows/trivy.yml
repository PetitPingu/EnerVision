name: Trivy Security Scan

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/core_api/**"
      - "apps/dashboard/**"
      - "apps/etl_worker/**"
      - ".github/workflows/trivy.yml"
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "apps/core_api/**"
      - "apps/dashboard/**"
      - "apps/etl_worker/**"
      - ".github/workflows/trivy.yml"

permissions:
  contents: read
  security-events: write

jobs:
  scan-fs:
    name: Scan deps (fs) - ${{ matrix.app }}
    if: |
      (github.event_name == 'push' && github.ref_name == 'dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - core_api
          - dashboard
          - etl_worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: apps/${{ matrix.app }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs-${{ matrix.app }}

  scan-image:
    name: Scan image - ${{ matrix.app }}
    if: |
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - core_api
          - dashboard
          - etl_worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: enervision/${{ matrix.app }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: enervision/${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.app }}
