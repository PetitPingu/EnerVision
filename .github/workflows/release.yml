name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      startsWith(github.event.pull_request.title, 'chore(release): v')

    steps:
      - name: Extract version
        id: meta
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if ! echo "$PR_TITLE" | grep -qE '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Titre de PR release invalide : $PR_TITLE"
            exit 1
          fi

          VERSION=$(echo "$PR_TITLE" | sed -E 's/^chore\(release\): (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          RELEASE_NAME=$(echo "$PR_TITLE" | sed -E 's/^chore\(release\): //')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "Release ${VERSION} (${RELEASE_NAME})"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.release_name }}
          body: ${{ github.event.pull_request.body }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          make_latest: true
