sonar.projectKey=dutark_petitpingu-enervision
sonar.organization=dutark

# Nom/version affiches dans l'UI SonarCloud.
sonar.projectName=EnerVision
sonar.projectVersion=1.0

# Monorepo (4 services Python, un dashboard Next.js/TS, Terraform) : on
# analyse tout depuis la racine plutot que de multiplier les projets Sonar,
# et on exclut le vendor/genere plutot que de restreindre sonar.sources.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.next/**,**/__pycache__/**,**/.terraform/**,**/dist/**,**/build/**,**/*.min.js,apps/dashboard/public/**,packages/db-schema/alembic/versions/**

sonar.sourceEncoding=UTF-8
